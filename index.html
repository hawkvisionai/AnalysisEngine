let LIVE_DRAWS={cal:null,'539':null};
async function loadLotteryDraws(id){
 const lotteryKey=id==='cal'?'california':id==='539'?'539':null;
 if(!lotteryKey)return [];
 const url=`${SUPABASE_URL}/rest/v1/hv_lottery_draws?lottery_key=eq.${encodeURIComponent(lotteryKey)}&select=draw_date,number_1,number_2,number_3,number_4,number_5&order=draw_date.desc`;
 const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
 if(!res.ok)throw new Error(`Supabase ${res.status}`);
 const rows=await res.json();
 const draws=rows.map(r=>['',r.draw_date,r.number_1,r.number_2,r.number_3,r.number_4,r.number_5]);
 LIVE_DRAWS[id]=draws;
 return draws;
}
function currentDraws(){return LIVE_DRAWS[state.id]||[]}
function mergeDraws(primary,fallback){let m=new Map();for(const r of [...(fallback||[]),...(primary||[])]){if(r&&r[1])m.set(String(r[1]),r)}return [...m.values()].sort((a,b)=>String(b[1]).localeCompare(String(a[1])))}
async function calNoDrawSource(){let remote=LIVE_DRAWS.cal||[];if(!remote.length){try{remote=await loadLotteryDraws('cal')}catch(e){console.warn('加州彩不出牌即時資料讀取失敗，改用內建正式歷史資料',e);remote=[]}}return mergeDraws(remote,(typeof CAL_DRAWS!=='undefined'&&Array.isArray(CAL_DRAWS))?CAL_DRAWS:[])}

function calSumActual(sum){return {bs:sum>=101?'大':sum<=99?'小':'和',oe:sum%2?'單':'雙'}}
function calSumBaseSignal(sums,oes,i){
 let size=null,oe=null,sizeInfo='',oeInfo='';
 if(i>=4){let a=sums.slice(i-4,i).reduce((x,y)=>x+y,0)/4;if(Math.abs(a-100)>=8){size=a>100?'大':'小';sizeInfo=`前4期平均 ${a.toFixed(2)}`}}
 if(i>=40){
  let p15=oes.slice(i-15,i).filter(x=>x==='單').length/15,a5=sums.slice(i-5,i).reduce((x,y)=>x+y,0)/5;
  if(Math.abs(p15-.5)>=1/6&&Math.abs(a5-100)>=4){oe=p15>.5?'雙':'單';oeInfo='第一級'}
  else{let p38=oes.slice(i-38,i).filter(x=>x==='單').length/38,a40=sums.slice(i-40,i).reduce((x,y)=>x+y,0)/40;if(Math.abs(p38-.5)>=.06&&Math.abs(a40-100)>=1){oe=p38>.5?'單':'雙';oeInfo='第二級'}}
 }
 return {size,oe,sizeInfo,oeInfo}
}
function calSumBuild(draws){
 const asc=[...(draws||[])].filter(r=>r&&r[1]).sort((a,b)=>String(a[1]).localeCompare(String(b[1])));
 const sums=asc.map(r=>r.slice(2,7).reduce((a,b)=>a+(+b||0),0)),acts=sums.map(calSumActual),oes=acts.map(x=>x.oe);
 let lastSizeResult=null,lastOeResult=null,rows=[];
 for(let i=0;i<asc.length;i++){
  let active=String(asc[i][1])>='2025-07-20',sig=calSumBaseSignal(sums,oes,i),sizeBet=active&&!!sig.size&&lastSizeResult==='敗',oeBet=active&&!!sig.oe&&lastOeResult==='敗';
  let sizeResult=null,oeResult=null,sizePnl=0,oePnl=0;
  if(active&&sig.size){sizeResult=acts[i].bs==='和'?'和':sig.size===acts[i].bs?'勝':'敗';if(sizeBet)sizePnl=sizeResult==='勝'?1960:sizeResult==='敗'?-2000:0;lastSizeResult=sizeResult}
  if(active&&sig.oe){oeResult=sig.oe===acts[i].oe?'勝':'敗';if(oeBet)oePnl=oeResult==='勝'?(sig.oe==='雙'?1940:1960):-2000;lastOeResult=oeResult}
  rows.push({date:String(asc[i][1]),sum:sums[i],bs:acts[i].bs,oe:acts[i].oe,sizeBase:sig.size,oeBase:sig.oe,sizeBet,oeBet,sizeResult,oeResult,sizePnl,oePnl,total:sizePnl+oePnl})
 }
 let nextSig=calSumBaseSignal(sums,oes,asc.length);
 return {rows,next:{sizeBase:nextSig.size,oeBase:nextSig.oe,sizeBet:!!nextSig.size&&lastSizeResult==='敗',oeBet:!!nextSig.oe&&lastOeResult==='敗',lastSizeResult,lastOeResult}}
}
function calSumMonthTable(rows){
 let m={};for(let r of rows){let ym=r.date.slice(0,7);if(!m[ym])m[ym]={bp:0,op:0,total:0,count:0};m[ym].bp+=r.sizePnl;m[ym].op+=r.oePnl;m[ym].total+=r.total;m[ym].count+=(r.sizeBet?1:0)+(r.oeBet?1:0)}
 return Object.keys(m).sort().reverse().slice(0,13).map((ym,i)=>`<tr><td>${ym}${i===0?'｜當月截至目前':''}</td><td>${m[ym].count}</td><td class="${m[ym].bp>=0?'ok':'bad'}">${m[ym].bp>=0?'+':''}${Math.round(m[ym].bp).toLocaleString()}</td><td class="${m[ym].op>=0?'ok':'bad'}">${m[ym].op>=0?'+':''}${Math.round(m[ym].op).toLocaleString()}</td><td class="${m[ym].total>=0?'ok':'bad'}"><b>${m[ym].total>=0?'+':''}${Math.round(m[ym].total).toLocaleString()}</b></td></tr>`).join('')
}
function nextCalDateFrom(draws){let d=new Date(draws[0][1]+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}

 if(mode.stakeType==='winRecovery')lastStakeState=recoveryIndex!==null?`斷階補注第${recoveryIndex+1}關`:`連勝階梯第${Math.min(stakeWin+1,(mode.winSeq||[]).length||8)}階${stakeWin>=((mode.winSeq||[]).length||8)-1?'（封頂）':''}`;
 else lastStakeState=mode.stakeType==='loss'?`連敗配注第${Math.min(stakeLoss+1,(mode.stakeSeq||[]).length||1)}關`:'連勝配注';
 let baselineEnd=asc.findIndex(r=>String(r[1])==='2026-09-25'),verified=true;
 return {streak:streakFromActions(actions),monthly,nextPct,lastPct,lastStakeState,pc,nextG:pkgClonePartition(g),verified,baselineEnd};
}
function pkgMonthlyHtml(monthly,mode){
 let keys=Object.keys(monthly).sort().reverse().slice(0,13);if(!keys.length)return '<div class="note">尚無足夠的月收益紀錄。</div>';
 return `<details style="margin-top:18px"><summary style="cursor:pointer;font-weight:800;font-size:17px;padding:12px 0">近13個月每月獲利</summary><div style="max-height:390px;overflow-y:auto;margin-top:8px">${keys.map((ym,i)=>`<div class="stat" style="margin-bottom:8px"><span class="label">${i===0?ym+'｜當月截至目前':ym}</span><b class="${monthly[ym]>=0?'ok':'bad'}">${monthly[ym]>=0?'+':''}${Math.round(monthly[ym]).toLocaleString()}</b></div>`).join('')}</div><div class="hint" style="margin-top:8px">依「${mode.name}」正式核心與配注逐期結算；連勝／連敗配注狀態跨月延續，不於每月第一期重置。</div></details>`;
}

async function packageDraws(){
 let remote=LIVE_DRAWS.cal;
 if(!remote){try{remote=await loadLotteryDraws('cal')}catch(e){console.warn('包牌即時資料讀取失敗，改用內建正式歷史資料',e);remote=[]}}
 let base=(typeof CAL_DRAWS!=='undefined'&&Array.isArray(CAL_DRAWS))?CAL_DRAWS:[];
 // 合併即時資料與內建613期正式資料；同日期以即時資料優先，確保新開獎可直接延伸分析。
 let byDate=new Map();base.forEach(r=>byDate.set(String(r[1]),r));(remote||[]).forEach(r=>byDate.set(String(r[1]),r));
 return [...byDate.values()].sort((a,b)=>String(b[1]).localeCompare(String(a[1])));
}
async function renderPackageInline(){let el=document.getElementById('pkgInline'),sel=document.getElementById('pkgMode');if(!el||!sel)return;let mode=PACKAGE_MODES.find(x=>x.id===sel.value)||PACKAGE_MODES[0];el.innerHTML='<div class="note" style="margin-top:18px">正在分析最新歷史資料…</div>';try{let draws=await packageDraws();if(draws.length<180)throw new Error('歷史資料不足180期');let perf=pkgPerformance(draws,mode),g=perf.nextG,p1=[...g[0]].sort((a,b)=>a-b),p2=[...g[1]].sort((a,b)=>a-b),pc=pkgCost(mode.sz),date=nextDate(draws),stakeAmt=Math.round(pc.cost*perf.nextPct);el.innerHTML=`<div style="margin-top:20px"><div class="note">資料截止：${draws[0][1]}｜推薦日期：<strong>${date}</strong><br>模式：<strong>${mode.name}</strong><br>分柱：${mode.sz.join(' × ')}｜組合數：${pc.comb.toLocaleString()}注｜1%基準下注：<strong>${Math.round(pc.cost).toLocaleString()}</strong></div><div class="resultGrid" style="margin-top:14px">${streakHtml(perf.streak)}<div class="stat"><span class="label">下一期建議下注</span><b>${perf.nextPct}%</b><small style="display:block;margin-top:5px">${perf.lastStakeState||''}</small></div><div class="stat"><span class="label">下一期下注金額</span><b>${stakeAmt.toLocaleString()}</b></div><div class="stat"><span class="label">核心狀態</span><b class="ok">正式核心已接入・自動追算最新資料</b></div></div><h2 style="margin:20px 0 8px">第一柱（${mode.sz[0]}碼）</h2><div class="balls" style="font-size:27px;line-height:1.8">${fmtBalls(p1)}</div><h2 style="margin:20px 0 8px">第二柱（${mode.sz[1]}碼）</h2><div class="balls" style="font-size:27px;line-height:1.8">${fmtBalls(p2)}</div><div class="hint" style="margin-top:18px">第三柱（${mode.sz[2]}碼）＝01～39扣除第一、第二柱後的全部剩餘號碼，不另外顯示。</div>${pkgMonthlyHtml(perf.monthly,mode)}<div class="panel" style="margin-top:18px"><h2>配注方式</h2><div class="note">${mode.stake}</div></div></div>`}catch(e){el.innerHTML='<div class="note" style="margin-top:18px">包牌分析資料不足，無法產生分柱。請確認歷史資料已載入。</div>';console.error(e)}}

async function loadHistoryDrawsNoCache(id){
 const lotteryKey=id==='cal'?'california':id==='539'?'539':null;
 if(!lotteryKey)return [];
 const url=`${SUPABASE_URL}/rest/v1/hv_lottery_draws?lottery_key=eq.${encodeURIComponent(lotteryKey)}&select=draw_date,number_1,number_2,number_3,number_4,number_5&order=draw_date.desc`;
 const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
 if(!res.ok)throw new Error(`Supabase ${res.status}`);
 const rows=await res.json();
 return rows.map(r=>['',r.draw_date,r.number_1,r.number_2,r.number_3,r.number_4,r.number_5]);
}

 body.innerHTML='<div class="note">正在讀取最新開獎資料…</div>';
